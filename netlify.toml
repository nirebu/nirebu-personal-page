# Netlify build settings for the Astro site.
# (Previously the Jekyll build was configured in the Netlify UI;
# this file makes the Astro build explicit and version-controlled.)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 18.17.1+ / 20.3.0+ / 22+ — pin an LTS.
  NODE_VERSION = "22"

# Hashed Astro assets (JS/CSS) are content-addressed: cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
